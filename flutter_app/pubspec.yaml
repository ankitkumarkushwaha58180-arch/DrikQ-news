name: drikq_news
description: "A complete, production-ready news reporting mobile application powered by Firebase."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase Suite
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.1

  # State Management & DI
  provider: ^6.1.2

  # Media & Video
  video_player: ^2.9.2
  chewie: ^1.8.5
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Utilities
  share_plus: ^10.1.1
  intl: ^0.19.0
  uuid: ^4.5.1
  flutter_svg: ^2.0.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
